<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SSC Command Center</title>
<meta name="description" content="A personal All-SSC exam preparation, eligibility, planning, tracking and information dashboard." />
<style>
/* ==========================================================================
   SSC Command Center — styles
   Clean cards, progress bars, tables, badges, dark/light, responsive shell.
   ========================================================================== */

:root {
  --radius: 14px;
  --radius-sm: 9px;
  --sp: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sidebar-w: 250px;
  --maxw: 1180px;

  /* dark (default) */
  --bg: #0d1117;
  --bg-elev: #151b24;
  --bg-elev2: #1b2330;
  --bg-hover: #202a38;
  --line: #263140;
  --line-soft: #1d2635;
  --text: #e8edf4;
  --text-dim: #9aa7b8;
  --text-faint: #6b7889;
  --accent: #4f8ef7;
  --accent-2: #7c5cff;
  --accent-soft: rgba(79, 142, 247, 0.14);
  --green: #3ecf8e;
  --amber: #f2b544;
  --orange: #f2864b;
  --red: #f0596b;
  --blue: #4f8ef7;
  --grey: #8a97a8;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
}

html[data-theme="light"] {
  --bg: #f4f6fa;
  --bg-elev: #ffffff;
  --bg-elev2: #f8fafc;
  --bg-hover: #eef2f8;
  --line: #e1e7ef;
  --line-soft: #edf1f6;
  --text: #17202c;
  --text-dim: #5a6675;
  --text-faint: #8a95a5;
  --accent: #2563eb;
  --accent-2: #6d47f0;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --green: #16a34a;
  --amber: #d99a12;
  --orange: #e0762c;
  --red: #dc3b4f;
  --blue: #2563eb;
  --grey: #64748b;
  --shadow: 0 8px 26px rgba(30, 45, 70, 0.1);
  --shadow-sm: 0 2px 8px rgba(30, 45, 70, 0.07);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.25; font-weight: 650; }
h1 { font-size: 24px; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0 0 10px; }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- layout ---------- */
#app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--line-soft); }
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; display: grid; place-items: center; font-weight: 800; letter-spacing: .5px;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text strong { font-size: 14.5px; }
.brand-text span { font-size: 11.5px; color: var(--text-faint); }
.side-nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav-group-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px;
  color: var(--text-faint); padding: 14px 12px 6px; font-weight: 700;
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  background: transparent; color: var(--text-dim); font: inherit; font-size: 14px; text-align: left;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.nav-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.nav-item .ni-ic { width: 20px; text-align: center; font-size: 15px; }
.nav-item .ni-badge {
  margin-left: auto; font-size: 11px; background: var(--bg-elev2); border: 1px solid var(--line);
  color: var(--text-dim); border-radius: 20px; padding: 1px 7px; min-width: 20px; text-align: center;
}
.nav-item .ni-badge.hot { background: rgba(240,89,107,.15); border-color: transparent; color: var(--red); }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--line-soft); display: grid; gap: 6px; }
.only-mobile { display: none; }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.search-wrap { position: relative; flex: 1; max-width: 560px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
#global-search {
  width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--text); font: inherit; font-size: 14px;
}
#global-search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 60;
}
.search-hit { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer;
  padding: 10px 12px; border-bottom: 1px solid var(--line-soft); color: var(--text); font: inherit; }
.search-hit:hover { background: var(--bg-hover); }
.search-hit .sh-kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); font-weight: 700; }
.search-hit .sh-title { font-weight: 600; font-size: 14px; }
.search-hit .sh-sub { font-size: 12px; color: var(--text-dim); }
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.src-link { font-size: 12px; }

.verify-banner {
  margin: 12px 18px 0; padding: 10px 14px; border-radius: var(--radius-sm);
  background: rgba(242,134,75,.12); border: 1px solid rgba(242,134,75,.35);
  color: var(--text); font-size: 13px;
}
.view { flex: 1; width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 18px; }
.app-footer {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 18px; border-top: 1px solid var(--line); color: var(--text-faint); font-size: 12px;
  max-width: var(--maxw); width: 100%; margin: 0 auto;
}

/* ---------- buttons / controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 14px; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 600; background: var(--accent); color: #fff;
  transition: transform .08s ease, opacity .12s ease, background .12s ease;
}
.btn:hover { opacity: .93; }
.btn:active { transform: translateY(1px); }
.btn.small { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.ghost { background: var(--bg-elev2); color: var(--text); border-color: var(--line); }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.danger { background: var(--red); color: #fff; }
.btn.ok { background: var(--green); color: #06130c; }
.btn.full { width: 100%; }
.btn.link { background: none; border: none; color: var(--accent); padding: 2px 4px; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--text); cursor: pointer; font-size: 16px;
}
.icon-btn:hover { background: var(--bg-hover); }
.profile-chip {
  display: flex; align-items: center; gap: 9px; padding: 5px 11px 5px 5px; border-radius: 30px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--text); cursor: pointer; font: inherit;
}
.profile-chip:hover { background: var(--bg-hover); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; font-size: 13px; }
.profile-chip-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.profile-chip-text strong { font-size: 12.5px; }
.profile-chip-text small { font-size: 10.5px; color: var(--text-faint); }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--bg-elev2);
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%;
}
textarea { min-height: 76px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.inline-form > label.field { margin-bottom: 0; flex: 1 1 150px; }

/* ---------- cards ---------- */
.card {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--sp); box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.card-sub { font-size: 12.5px; color: var(--text-dim); }
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.auto-sm { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
.section-title h2 { margin: 0; }
.section-title .line { flex: 1; height: 1px; background: var(--line); }

/* ---------- badges / pills ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650;
  padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-elev2); color: var(--text-dim);
  white-space: nowrap;
}
.badge.green { color: var(--green); border-color: rgba(62,207,142,.4); background: rgba(62,207,142,.1); }
.badge.amber { color: var(--amber); border-color: rgba(242,181,68,.4); background: rgba(242,181,68,.1); }
.badge.orange { color: var(--orange); border-color: rgba(242,134,75,.4); background: rgba(242,134,75,.1); }
.badge.red { color: var(--red); border-color: rgba(240,89,107,.4); background: rgba(240,89,107,.1); }
.badge.blue { color: var(--blue); border-color: rgba(79,142,247,.4); background: rgba(79,142,247,.1); }
.badge.grey { color: var(--grey); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.stars { color: var(--amber); letter-spacing: 1px; }

/* ---------- progress ---------- */
.progress { height: 8px; border-radius: 20px; background: var(--bg-elev2); overflow: hidden; border: 1px solid var(--line-soft); }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
.progress.thin { height: 6px; }
.progress.green > span { background: linear-gradient(90deg, #2fb37a, var(--green)); }
.progress.amber > span { background: linear-gradient(90deg, #d99a12, var(--amber)); }
.metric { display: flex; flex-direction: column; gap: 4px; }
.metric .m-val { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.metric .m-lab { font-size: 12px; color: var(--text-dim); }
.metric .m-sub { font-size: 11.5px; color: var(--text-faint); }

/* ---------- stat tiles ---------- */
.stat-tile { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); }
.stat-tile .st-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.stat-tile .st-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); font-size: 17px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { background: var(--bg-elev2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); font-weight: 700; position: sticky; top: 0; }
tbody tr:hover { background: var(--bg-hover); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- lists ---------- */
.list-item {
  display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.list-item:last-child { border-bottom: none; }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-title { font-weight: 600; font-size: 14px; }
.list-item .li-sub { font-size: 12.5px; color: var(--text-dim); }
.checkbox {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg-elev2);
  display: grid; place-items: center; cursor: pointer; flex: 0 0 20px; color: transparent; font-size: 12px; margin-top: 2px;
}
.checkbox.done { background: var(--green); border-color: var(--green); color: #06130c; }

/* ---------- tags / chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--bg-elev2); font-size: 12.5px; cursor: pointer; color: var(--text-dim);
}
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
.chip.toggle { cursor: pointer; }
.chip .x { color: var(--text-faint); font-weight: 700; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- topic cards ---------- */
.topic-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; background: var(--bg-elev2); }
.topic-card .tc-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.topic-card .tc-title { font-weight: 650; font-size: 13.5px; }
.topic-card .tc-stats { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-dim); margin-top: 6px; flex-wrap: wrap; }
.status-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 650; border: 1px solid transparent; cursor: pointer; }
.st-not_started { background: var(--bg-hover); color: var(--text-faint); border-color: var(--line); }
.st-learning { background: rgba(79,142,247,.14); color: var(--blue); border-color: rgba(79,142,247,.35); }
.st-practicing { background: rgba(242,181,68,.14); color: var(--amber); border-color: rgba(242,181,68,.35); }
.st-revision_due { background: rgba(242,134,75,.14); color: var(--orange); border-color: rgba(242,134,75,.35); }
.st-strong { background: rgba(62,207,142,.14); color: var(--green); border-color: rgba(62,207,142,.35); }

/* ---------- timeline ---------- */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-elev); }
.tl-item.personal::before { background: var(--amber); }
.tl-item.exam::before { background: var(--red); }
.tl-date { font-size: 11.5px; color: var(--text-faint); font-weight: 600; }

/* ---------- calendar ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { font-size: 11px; text-transform: uppercase; color: var(--text-faint); text-align: center; font-weight: 700; padding-bottom: 4px; }
.cal-day { min-height: 84px; border: 1px solid var(--line-soft); border-radius: 10px; padding: 6px; background: var(--bg-elev2); font-size: 12px; }
.cal-day.out { opacity: .35; }
.cal-day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day .cd-num { font-weight: 700; font-size: 12px; color: var(--text-dim); }
.cal-ev { margin-top: 3px; font-size: 10.5px; padding: 2px 5px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
.cal-ev.official { background: rgba(240,89,107,.16); color: var(--red); }
.cal-ev.personal { background: rgba(242,181,68,.16); color: var(--amber); }
.cal-ev.task { background: rgba(79,142,247,.16); color: var(--blue); }
.cal-ev.result { background: rgba(62,207,142,.16); color: var(--green); }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80; backdrop-filter: blur(2px); }
.modal {
  position: fixed; z-index: 90; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(620px, calc(100vw - 28px)); max-height: 88vh; overflow-y: auto;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
.modal.wide { width: min(920px, calc(100vw - 28px)); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-elev); z-index: 2; }
.modal-head h3 { margin: 0; }
.modal-body { padding: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--bg-elev); }

/* ---------- toast ---------- */
.toast-root { position: fixed; bottom: 18px; right: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--bg-elev); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 13.5px; max-width: 340px; animation: toastIn .18s ease; }
.toast.ok { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- charts ---------- */
.chart { width: 100%; overflow: visible; }
.chart .gridline { stroke: var(--line-soft); }
.chart .axis-label { fill: var(--text-faint); font-size: 10px; }
.chart .line { fill: none; stroke-width: 2; }
.chart .dot { fill: var(--accent); }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); }
.chart-legend .lg { display: flex; align-items: center; gap: 6px; }
.chart-legend .sw { width: 11px; height: 11px; border-radius: 3px; }

/* ---------- empty state ---------- */
.empty { text-align: center; padding: 34px 16px; color: var(--text-dim); }
.empty .e-ic { font-size: 34px; opacity: .7; }
.empty h3 { margin: 10px 0 4px; }

/* ---------- misc ---------- */
.source-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; }
.src-official { color: var(--green); }
.src-gov { color: var(--blue); }
.src-news { color: var(--amber); }
.src-edu { color: var(--grey); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--text-dim); font-weight: 600; }
.kv dd { margin: 0; }
.verify-flag { color: var(--orange); font-weight: 600; }
.priority-urgent { color: var(--red); font-weight: 700; }
.priority-important { color: var(--orange); font-weight: 700; }
.priority-info { color: var(--blue); font-weight: 700; }
.pin-btn { background: none; border: none; cursor: pointer; font-size: 17px; color: var(--text-faint); padding: 2px; }
.pin-btn.on { color: var(--amber); }
.note-card { border-left: 3px solid var(--accent); }
.scroll-x { overflow-x: auto; }

  return rows.map((r) => `
    <div class="bar-row" style="margin-bottom:8px">
      <span class="bl" title="${esc(r.label)}">${esc(r.label)}</span>
      <span style="flex:1">
        <span class="progress thin"><span style="width:${((r.value / max) * 100).toFixed(0)}%;background:${r.color || "var(--accent)"}"></span></span>
      </span>
      <span class="bv">${esc(format(r.value))}</span>

/* ---------- donut ---------- */
function donut(segments = [], { size = 160, thickness = 20, centerTop = "", centerSub = "" } = {}) {
  const total = segments.reduce((a, s) => a + s.value, 0);
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const arcs = segments.filter((s) => s.value > 0).map((s, i) => {
    const frac = total ? s.value / total : 0;
    const len = frac * circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color || color(i)}"
      stroke-width="${thickness}" stroke-dasharray="${len.toFixed(1)} ${(circ - len).toFixed(1)}"
      stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})">
      <title>${esc(s.label)}: ${s.value}</title></circle>`;
    offset += len;
    return el;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-elev2)" stroke-width="${thickness}"/>
    ${arcs}
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">${esc(centerTop)}</text>
    <text x="${cx}" y="${cy + 16}" text-anchor="middle" fill="var(--text-faint)" font-size="10">${esc(centerSub)}</text>
  </svg>`;
}

/* ==========================================================================
   io.js — data export / import, isolated so it can be shared by the shell and
   the settings view without creating a circular import.
   ========================================================================== */

const { exportJSON, importJSON } = __require("store.js");
const { download, readFile, todayISO } = __require("utils.js");
const { toast, confirmDialog } = __require("ui.js");

function doExport() {
  download(`ssc-command-center-${todayISO()}.json`, exportJSON());
  toast("Exported your data as JSON.", "ok");
}

function doImport() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    const ok = await confirmDialog(
      "Importing replaces everything currently stored in this browser. Export first if you want a backup.",
      { title: "Import data", confirmLabel: "Replace & import", danger: true }
    );
    if (!ok) return;
    try {
      const text = await readFile(file);
      importJSON(text);
      toast("Data imported — reloading…", "ok");
      setTimeout(() => location.reload(), 500);
    } catch (err) {
      toast(`Import failed: ${err.message}`, "err");
    }
  };
  input.click();
}


Object.assign(module.exports, { doExport, doImport });
};

    } else if (cycleLevel === "graduate") {
      category = CATEGORY.AFTER_GRADUATION;
      reasons.push(
        grad.expectedYear
          ? `Becomes available after your graduation (expected ${grad.expectedYear}).`
          : "Becomes available after you complete your bachelor's degree."
      );
    } else if (cycleLevel === "postgraduate") {
      category = CATEGORY.LATER;
      reasons.push("Becomes available only after a Master's degree.");
    } else if (cycleLevel === "diploma") {
      category = CATEGORY.LATER;
      reasons.push("Requires a diploma/degree in a specific branch.");
    } else {
      category = CATEGORY.NOT_ELIGIBLE;
      reasons.push(`Requires ${qualLabel(cycleLevel)}.`);
    }
  }

  // ---------- age check ----------
  let ageAtRef = null;
  const elig = cycle?.eligibility || {};
  if (profile.dob && elig.ageRefDate) {
    ageAtRef = ageOn(profile.dob, elig.ageRefDate);
  }
  const ageVerified = elig.ageMin !== null && elig.ageMax !== null && elig.ageRefDate;
  if (ageVerified && ageAtRef !== null) {
    if (ageAtRef < elig.ageMin) {
      category = CATEGORY.AGE_RESTRICTED;
      reasons.push(`Your age on ${elig.ageRefDate} would be ${ageAtRef}; the notified minimum is ${elig.ageMin}.`);
    } else if (ageAtRef > elig.ageMax) {
      category = CATEGORY.AGE_RESTRICTED;
      reasons.push(`Your age on ${elig.ageRefDate} would be ${ageAtRef}; the notified maximum is ${elig.ageMax}.`);
    } else {
      reasons.push(`Age on ${elig.ageRefDate}: ${ageAtRef} — within the notified band (${elig.ageMin}–${elig.ageMax}).`);
    }
  } else {
    reasons.push("Age band for this cycle is not recorded yet, so age eligibility cannot be confirmed.");
  }

  // Always remind that the notification governs the cut-off.
  reasons.push("Eligibility for a specific cycle ultimately depends on the qualification/age cut-off date stated in that cycle's official notification.");

  // ---------- confidence ----------
  let confidence = "verify";
  if (verifiedCycle && ageVerified) confidence = "verified";
  else if (verifiedCycle) confidence = "likely";
  else confidence = "verify";

  return {
    examId,
    exam,
    cycle,
    cycleLabel,
    category,
    confidence,
    verifiedCycle,
    ageAtRef,
    ageVerified,
    headline: headlineFor(category, confidence),
    reasons,
    sources,
  };
}

function headlineFor(category, confidence) {
  switch (category) {
    case CATEGORY.ELIGIBLE_NOW:
      return confidence === "verified" ? "Eligible (verified from notice)" : "Likely eligible — requires verification";
    case CATEGORY.AFTER_GRADUATION:
      return "Eligible after graduation";
    case CATEGORY.LATER:
      return "Eligible later — additional qualification needed";
    case CATEGORY.AGE_RESTRICTED:
      return "Age may be a constraint for this cycle";
    case CATEGORY.NOT_ELIGIBLE:
      return "Not enough information to assess yet";
    default:
      return "Requires verification";
  }
}

/** Evaluate every exam and bucket the results. */
function evaluateAll(profile = {}) {
  const results = EXAMS.map((e) => evaluateExam(e.id, profile));
  const bucket = {
    eligible_now: [],
    after_graduation: [],
    later: [],
    age_restricted: [],
    not_eligible: [],
  };
  for (const r of results) if (r) bucket[r.category].push(r);
  return { results, bucket };
}

/** 0–100 readiness score for the "how ready is my profile" ideas (not selection odds). */
function profileCompleteness(profile = {}) {
  const checks = ["name", "dob", "educationLevel", "collegeYear", "degree", "dailyStudyMinutes", "prepLevel"];

/* ==========================================================================
   search.js — global search across every entity in the app (§34).
   Returns a list of hits: { kind, title, sub, route }.
   ========================================================================== */

const { state } = __require("store.js");
const { TOPICS, SUBJECTS } = __require("data/subjects.js");
const { EXAMS } = __require("data/exams.js");
const { esc, truncate } = __require("utils.js");

function match(text, q) {
  return text && text.toLowerCase().includes(q);
}

function searchAll(query) {
  const q = String(query || "").trim().toLowerCase();
  if (q.length < 2) return [];
  const hits = [];

  const push = (kind, title, sub, route) => hits.push({ kind, title, sub, route });

  // Subjects / topics
  for (const t of TOPICS) {
    if (match(t.name, q)) {
      push("Topic", t.name, `${SUBJECTS[t.subject]?.name || t.subject}`, `#/syllabus?subject=${t.subject}`);
    }
  }

  // Exams
  for (const e of EXAMS) {
    if (match(e.name, q) || match(e.fullName, q) || match(e.code, q)) {
      push("Exam", e.name, e.fullName, `#/exams/${e.id}`);
    }
  }

  // Tasks
  for (const t of state.tasks) {
    if (match(t.title, q) || match(t.notes, q)) {
      push("Task", t.title, `${t.date} · ${t.status.replace("_", " ")}`, "#/planner");
    }
  }

  // Notes
  for (const n of state.notes) {
    if (match(n.title, q) || match(n.body, q)) {
      push("Note", n.title || "(untitled note)", truncate(n.body, 70), "#/notes");
    }
  }

  // PYQs
  for (const p of state.pyqs) {
    if (match(p.question, q) || match(p.topicName, q)) {
      push("PYQ", truncate(p.question || "(PYQ)", 70), `${p.examId || ""} ${p.year || ""} ${p.topicName || ""}`.trim(), "#/pyq");
    }
  }

  // Mistakes
  for (const m of state.mistakes) {
    if (match(m.question, q) || match(m.reason, q)) {
      push("Mistake", truncate(m.question || "(mistake)", 70), `${m.reason || ""} ${m.topicName || ""}`.trim(), "#/mistakes");
    }
  }

  // Mocks
  for (const mk of state.mocks) {
    if (match(mk.name, q)) push("Mock", mk.name, `${mk.date} · score ${mk.correct ?? "—"}`, "#/mocks");
  }

  // Current affairs
  for (const ca of state.currentAffairs) {
    if (match(ca.title, q) || match(ca.notes, q)) {
      push("Current affairs", ca.title, `${ca.category || ""} · ${ca.date || ""}`, "#/current-affairs");
    }
  }

  // Updates
  for (const u of state.updates) {
    if (match(u.headline, q) || match(u.summary, q)) {
      push("SSC update", u.headline, `${u.examId || ""} · ${u.date || ""}`.trim(), "#/updates");
    }
  }

  // Deadlines
  for (const d of state.deadlines) {
    if (match(d.title, q)) push("Deadline", d.title, `${d.date} · ${d.kind}`, "#/deadlines");
  }

  return hits.slice(0, 40);
}

function renderSearchResults(hits) {
  if (!hits.length) return `<div class="search-hit"><span class="sh-sub">No matches.</span></div>`;
  return hits.map((h) => `
    <button class="search-hit" data-route="${esc(h.route)}">
      <div class="sh-kind">${esc(h.kind)}</div>
      <div class="sh-title">${esc(h.title || "")}</div>
      ${h.sub ? `<div class="sh-sub">${esc(h.sub)}</div>` : ""}
    </button>`).join("");
}


Object.assign(module.exports, { searchAll, renderSearchResults });
};

/* ==========================================================================

/** Schedule (or refresh) a revision entry for a topic. */
function scheduleRevision(topicId, count = 0, due = null) {
  const existing = state.revisions.find((r) => r.topicId === topicId && r.status === "pending");
  if (existing && existing.count >= count) return existing;
  const date = due || nextRevisionDate(count).date;
  if (existing) { existing.count = count; existing.due = date; return existing; }
  const entry = {
    id: uid("rev"),
    topicId,
    count,
    due: date,
    status: "pending",
    createdAt: Date.now(),
    history: [],
  };
  state.revisions.push(entry);
  return entry;
}

/**
 * Complete a task. Returns a small summary of the side-effects so the caller
 * can show an informative toast.
 */
function completeTask(task) {
  task.status = "completed";
  task.completedAt = Date.now();
  logActivity(task.durationMin, 1, task.date === todayISO() ? todayISO() : task.date);

  const effects = [];
  if (task.topicId) {
    const p = recordTopicStudy(task.topicId, {
      minutes: task.durationMin,
      attempted: task.questionsAttempted || 0,
      correct: task.correct || 0,
    });
    if (task.type === "revision") {
      p.revisionCount += 1;
      p.lastRevised = todayISO();
      if (p.status === "revision_due") p.status = "strong";
      // close the pending revision (if one was scheduled)
      const rev = state.revisions.find((r) => r.topicId === task.topicId && r.status === "pending");
      if (rev) {
        rev.status = "done";
        rev.completedAt = Date.now();
        (rev.history ||= []).push({ at: Date.now(), count: rev.count });
      }
      effects.push("revision logged");
      // schedule the next suggested revision while intervals remain
      const intervals = state.settings.revisionIntervals || [];
      const nextCount = rev ? rev.count + 1 : p.revisionCount;
      if (nextCount < intervals.length) {
        scheduleRevision(task.topicId, nextCount);
        effects.push("next revision scheduled");
      }
    } else {

        if (p.status === "learning") p.status = "practicing";
      }
      p.status = p.status === "strong" ? "strong" : p.status;

      // any first study schedules a suggested revision
      if (!state.revisions.some((r) => r.topicId === task.topicId && r.status === "pending")) {

/** Save a wrong question to the mistake notebook from anywhere. */
function saveMistake(data) {

      <div class="card">
        <div class="card-head"><h2>🧪 Practice snapshot</h2><a class="btn ghost small" href="#/analytics">Analytics</a></div>
        <div class="grid cols-3">
          <div class="metric"><span class="m-val">${state.pyqs.length}</span><span class="m-lab">PYQ sets</span></div>

  wire(root, ctx);

function statusWord(s) {
  return ({ not_started: "not started", learning: "learning", practicing: "practicing", revision_due: "revision due", strong: "strong" })[s] || s;
}

function upcomingList() {
  const today = todayISO();
  return state.deadlines
    .filter((d) => !d.done && d.date >= today)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, 6);

function wire(root, ctx) {
  root.querySelectorAll("[data-toggle-task]").forEach((btn) => btn.addEventListener("click", () => {
    const task = state.tasks.find((t) => t.id === btn.dataset.toggleTask);
    if (!task) return;
    if (task.status === "completed") {
      task.status = "not_started"; task.completedAt = null; commit();
    } else {
      const effects = completeTask(task);
      toast(`Task completed${effects.length ? " · " + effects.join(", ") : ""}`, "ok");
    }
    ctx.refresh();
  }));
  root.querySelectorAll("[data-edit-task]").forEach((btn) => btn.addEventListener("click", () => {
    const task = state.tasks.find((t) => t.id === btn.dataset.editTask);
    if (task) openTaskEditor(task, ctx);
  }));
  root.querySelectorAll("[data-pin-exam]").forEach((btn) => btn.addEventListener("click", () => {
    const id = btn.dataset.pinExam;
    const i = state.pinnedExams.indexOf(id);
    if (i >= 0) state.pinnedExams.splice(i, 1);
    else state.pinnedExams.push(id);
    commit();
    ctx.refresh();
  }));
  root.querySelectorAll('[data-action="plan-today"]').forEach((btn) => btn.addEventListener("click", () => {
    carryForwardOverdue();
    ctx.navigate("#/planner");
  }));
}


Object.assign(module.exports, { dashboard });
};

    else ctx.refresh();

function opt(value, label, current) {
  return `<option value="${esc(value)}" ${String(current) === String(value) ? "selected" : ""}>${esc(label)}</option>`;
}

  return { "10th": "Class 10", "12th": "Class 12", graduate: "Graduate", postgraduate: "Postgraduate", diploma: "Diploma" }[q] || q;

function collegeRoad(p) {
  if (p.educationLevel !== "in-college") {
    return `<span class="muted small">College progression appears when your education level is set to “In college”.</span>`;

  const duration = Number(p.degreeDurationYears) || 3;
  const current = Number(p.collegeYear) || 1;

  }
  nodes.push(`<span class="faint">→</span><span class="badge ${current > duration ? "green" : "grey"}">Graduation</span>`);
  return nodes.join("");
}


Object.assign(module.exports, { profile });

      ${cycles.length <= 1 ? `<div class="muted small">Only one cycle exists. Add next year's cycle when the notification appears — old cycles are never overwritten (versioned history).</div>` : ""}
      <div class="table-wrap" style="margin-top:10px">
        <table>
          <thead><tr><th>Cycle</th><th>Status</th><th>Verified</th><th>Notification</th><th>Application closes</th><th></th></tr></thead>
          <tbody>
            ${cycles.map((c) => `<tr>
              <td><strong>${esc(c.label)}</strong>${c.id === cycle?.id ? ' <span class="badge blue">active</span>' : ""}</td>
              <td>${esc(c.status)}</td>
              <td>${c.verified ? "✅" : "—"}</td>
              <td>${c.notificationDate ? esc(fmtDate(c.notificationDate)) : unverified()}</td>
              <td>${c.applicationClose ? esc(fmtDate(c.applicationClose)) : unverified()}</td>
              <td class="row" style="gap:6px">
                ${c.id !== cycle?.id ? `<button class="btn link small" data-set-cycle="${c.id}">Set active</button>` : ""}
                <button class="btn link small" data-edit-cycle-id="${c.id}">Edit</button>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;

  root.querySelector("[data-pin]").addEventListener("click", () => {
    const i = state.pinnedExams.indexOf(examId);
    if (i >= 0) state.pinnedExams.splice(i, 1); else state.pinnedExams.push(examId);
    commit(); ctx.refresh();
  });
  root.querySelectorAll("[data-set-cycle]").forEach((b) => b.addEventListener("click", () => {
    setActiveCycle(examId, b.dataset.setCycle); ctx.refresh();
  }));
  const ec = root.querySelector('[data-action="edit-cycle"]');
  if (ec && cycle) ec.addEventListener("click", () => openCycleEditor(cycle, ctx));
  const acf = root.querySelector('[data-action="add-cycle-for"]');
  if (acf) acf.addEventListener("click", () => addCycleModal(ctx, examId));
  root.querySelectorAll("[data-edit-cycle-id]").forEach((b) => b.addEventListener("click", () => {
    const c = getCycle(b.dataset.editCycleId);
    if (c) openCycleEditor(c, ctx);
  }));
  const as = root.querySelector('[data-action="add-source"]');
  if (as && cycle) as.addEventListener("click", () => openSourceEditor(cycle, ctx));
}

function examSubjectsTopics(examId, subject) {
  return examTopicIds(examId).filter((id) => TOPIC_BY_ID[id]?.subject === subject);
}

/* ============================ Compare ============================ */

function compare(root, ctx) {
  const selected = (ctx.query.get("exams") || state.pinnedExams.slice(0, 3).join(",")).split(",").filter((id) => EXAM_BY_ID[id]).slice(0, 4);
  const rows = [
    ["Minimum qualification", (e) => qualLabel(e.qualification.level)],
    ["Qualification detail", (e) => e.qualification.detail || "—"],
    ["Age limit", () => `<span class="verify-flag">Cycle-specific — verify in the notification</span>`],
    ["Stages", (e) => e.stages.join(" · ")],
    ["Quantitative Aptitude", (e) => subjTopics(e, "quant")],
    ["Reasoning", (e) => subjTopics(e, "reasoning")],
    ["English", (e) => subjTopics(e, "english")],
    ["General Awareness", (e) => subjTopics(e, "ga")],
    ["Statistics", (e) => subjTopics(e, "stats")],
    ["Finance & Economics", (e) => subjTopics(e, "finance")],
    ["Technical", (e) => subjTopics(e, "technical")],
    ["Physical test", (e) => e.physical ? "Applicable (standards per notification)" : "Not applicable"],
    ["Skill test", (e) => [e.skill.typing && "Typing", e.skill.steno && "Stenography", e.skill.dest && "DEST"].filter(Boolean).join(", ") || "Not applicable"],
    ["Typical frequency", (e) => e.frequency],
  ];

  root.innerHTML = `
    <div class="card">
      <h1>⚖️ Compare Exams</h1>
      <div class="muted">Purely factual. Exams are never ranked best-to-worst here.</div>
      <div class="chip-row" style="margin-top:12px">
        ${EXAMS.map((e) => `<button class="chip toggle ${selected.includes(e.id) ? "active" : ""}" data-cmp="${e.id}">${esc(e.name)}</button>`).join("")}
      </div>
      <p class="small faint" style="margin-top:8px">Select up to 4 exams.</p>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Feature</th>${selected.map((id) => `<th>${esc(EXAM_BY_ID[id].name)}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map(([label, fn]) => `<tr><td><strong>${esc(label)}</strong></td>${selected.map((id) => `<td>${fn(EXAM_BY_ID[id])}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;

  root.querySelectorAll("[data-cmp]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.cmp;
    const i = selected.indexOf(id);
    if (i >= 0) selected.splice(i, 1);
    else if (selected.length < 4) selected.push(id);
    else return toast("Up to 4 exams at a time.", "err");
    ctx.navigate(`#/compare?exams=${selected.join(",")}`);
  }));
}

function subjTopics(exam, subject) {
  const ids = examSubjectsTopics(exam.id, subject);
  if (!ids.length) return "<span class='faint'>—</span>";
  return ids.map((id) => esc(TOPIC_BY_ID[id]?.name || id)).join(", ");
}

/* ============================ Archive ============================ */

function archive(root, ctx) {
  const byYear = {};
  for (const c of state.cycles) (byYear[c.year] ||= []).push(c);
  const years = Object.keys(byYear).sort((a, b) => b - a);

  root.innerHTML = `
    <div class="card">
      <h1>🗂️ Cycle Archive</h1>
      <div class="muted">Every exam cycle is kept separately, per year. Old cycle information is never overwritten — so a pattern change in a later year stays traceable (§37).</div>
    </div>
    ${years.map((y) => `
      <div class="card" style="margin-top:14px">
        <div class="card-head"><h2>${esc(y)}</h2><span class="badge">${byYear[y].length} cycles</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Cycle</th><th>Status</th><th>Verified</th><th>Sources</th><th>Notes</th><th></th></tr></thead>
            <tbody>
              ${byYear[y].sort((a, b) => EXAM_BY_ID[a.examId]?.name.localeCompare(EXAM_BY_ID[b.examId]?.name || "") || 0).map((c) => `
                <tr>
                  <td><a href="#/exams/${c.examId}"><strong>${esc(c.label)}</strong></a></td>
                  <td>
                    <select data-status="${c.id}" class="small" style="width:auto">
                      ${["planned", "active", "completed", "archived"].map((s) => `<option value="${s}" ${c.status === s ? "selected" : ""}>${s}</option>`).join("")}
                    </select>
                  </td>
                  <td>${c.verified ? "✅" : "—"}</td>
                  <td class="num">${c.sources.length}</td>
                  <td class="small muted">${c.pattern?.note ? esc(c.pattern.note.slice(0, 60)) : "—"}</td>
                  <td><button class="btn link small" data-edit-cycle-id="${c.id}">Edit</button></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`).join("")}`;

  root.querySelectorAll("[data-status]").forEach((sel) => sel.addEventListener("change", () => {
    const c = getCycle(sel.dataset.status);
    if (c) { c.status = sel.value; commit(); toast(`Marked ${c.label} ${sel.value}.`, "ok"); }
  }));
  root.querySelectorAll("[data-edit-cycle-id]").forEach((b) => b.addEventListener("click", () => {
    const c = getCycle(b.dataset.editCycleId);
    if (c) openCycleEditor(c, ctx);
  }));
}

/* ============================ editors ============================ */

function openCycleEditor(cycle, ctx) {
  const e = cycle.eligibility;
  const fm = (name, label, value, type = "text", extra = "") =>
    `<label class="field"><span>${esc(label)}</span><input name="${name}" type="${type}" value="${esc(value ?? "")}" ${extra} /></label>`;

  openModal({
    title: `Edit ${cycle.label}`,
    wide: true,
    body: `
      <p class="small muted">Only enter values you have read in an official SSC source. Leave anything unknown blank — blank means “Not currently verified”, never zero.</p>
      <div class="field-row-3">
        ${fm("notificationDate", "Notification date", cycle.notificationDate, "date")}
        ${fm("applicationStart", "Application start", cycle.applicationStart, "date")}
        ${fm("applicationClose", "Application close", cycle.applicationClose, "date")}
      </div>

        ${fm("correctionWindowStart", "Correction window start", cycle.correctionWindowStart, "date")}

      <label class="field"><span>Qualification for this cycle</span>

        <select name="status">
          ${["planned", "active", "completed", "archived"].map((s) => `<option value="${s}" ${cycle.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select></label>`,
    footer: `<button class="btn ghost" data-modal-close>Cancel</button><button class="btn" data-save>Save cycle</button>`,
    onMount: (node) => {
      node.querySelector("[data-save]").addEventListener("click", () => {
        const g = (n) => node.querySelector(`[name="${n}"]`).value.trim();
        const gv = (n) => g(n) || null;
        Object.assign(cycle, {
          notificationDate: gv("notificationDate"),
          applicationStart: gv("applicationStart"),
          applicationClose: gv("applicationClose"),
          correctionWindowStart: gv("correctionWindowStart"),
          correctionWindowEnd: gv("correctionWindowEnd"),
          admitCardDate: gv("admitCardDate"),
          answerKeyDate: gv("answerKeyDate"),
          resultDate: gv("resultDate"),
          vacancies: g("vacancies") ? Number(g("vacancies")) : null,
          status: g("status") || cycle.status,
          skillTests: gv("skillTests"),
          physicalRequirements: gv("physicalRequirements"),
          documentRequirements: gv("documentRequirements"),
          verified: node.querySelector('[name="verified"]').checked,
        });
        cycle.eligibility = {
          ...cycle.eligibility,
          qualificationLevel: g("qualificationLevel") || cycle.eligibility.qualificationLevel,
          ageMin: g("ageMin") ? Number(g("ageMin")) : null,
          ageMax: g("ageMax") ? Number(g("ageMax")) : null,
          ageRefDate: gv("ageRefDate"),
        };
        cycle.pattern = { ...cycle.pattern, note: gv("patternNote"), negativeMarking: gv("negativeMarking") };
        if (cycle.verified && !cycle.lastVerified) cycle.lastVerified = todayISO();
        commit();
        closeModal();
        toast("Cycle saved.", "ok");
        ctx.refresh();
      });
    },
  });
}

function openSourceEditor(cycle, ctx) {
  openModal({
    title: `Add source to ${cycle.label}`,
    body: `
      <label class="field"><span>Source name</span><input name="name" placeholder="e.g. SSC CGL 2026 Notice (ssc.gov.in)" /></label>
      <label class="field"><span>Source URL</span><input name="url" placeholder="https://ssc.gov.in/…" /></label>
      <div class="field-row">
        <label class="field"><span>Source type</span>
          <select name="type">
            <option value="official">🟢 Official SSC</option>
            <option value="gov">🔵 Government source</option>
            <option value="news">🟡 Reputable news / report</option>
            <option value="edu">⚪ Educational / preparation</option>
          </select></label>
        <label class="field"><span>Publication date</span><input name="publishedDate" type="date" /></label>
      </div>
      <label class="field"><span>Last verified</span><input name="lastVerified" type="date" value="${todayISO()}" /></label>`,
    footer: `<button class="btn ghost" data-modal-close>Cancel</button><button class="btn" data-save>Add source</button>`,
    onMount: (node) => {
      node.querySelector("[data-save]").addEventListener("click", () => {
        const g = (n) => node.querySelector(`[name="${n}"]`).value.trim();
        if (!g("name")) return toast("A source needs at least a name.", "err");
        cycle.sources.push({
          name: g("name"), url: g("url"), type: g("type") || "edu",
          publishedDate: g("publishedDate") || null, lastVerified: g("lastVerified") || null,
        });
        commit(); closeModal(); toast("Source added.", "ok"); ctx.refresh();
      });
    },
  });
}

function addCycleModal(ctx, presetExamId = "") {
  const currentYear = new Date().getFullYear();
  openModal({
    title: "Add an exam cycle",
    body: `
      <label class="field"><span>Exam</span>
        <select name="examId">${EXAMS.map((e) => `<option value="${e.id}" ${e.id === presetExamId ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></label>
      <label class="field"><span>Year</span><input name="year" type="number" min="${currentYear}" max="${currentYear + 15}" value="${currentYear + 1}" /></label>
      <p class="small muted">A new cycle starts as an empty, unverified placeholder. Nothing about it is invented — fill in details from the official notice when it is published.</p>`,
    footer: `<button class="btn ghost" data-modal-close>Cancel</button><button class="btn" data-save>Create cycle</button>`,
    onMount: (node) => {
      node.querySelector("[data-save]").addEventListener("click", () => {
        const examId = node.querySelector('[name="examId"]').value;
        const year = Number(node.querySelector('[name="year"]').value);
        if (state.cycles.some((c) => c.examId === examId && c.year === year)) return toast("That cycle already exists.", "err");
        const c = makeCycle(examId, year);
        state.cycles.push(c);
        // newly created cycles from a future year become the active one
        state.activeCycle[examId] = c.id;
        commit(); closeModal(); toast(`Created ${c.label}.`, "ok"); ctx.refresh();
      });
    },
  });
}

/* ---------- helpers ---------- */

function unverified() { return `<span class="verify-flag">Not currently verified</span>`; }
function dateOrUnverified(d) { return d ? esc(fmtDate(d)) : unverified(); }
function catColor(cat) {
  return { eligible_now: "green", after_graduation: "blue", later: "amber", age_restricted: "red", not_eligible: "grey" }[cat] || "grey";
}


Object.assign(module.exports, { myExams, examDetail, compare, archive, openCycleEditor, openSourceEditor, addCycleModal });
};

/* ---------- smart parsing (§14) ---------- */

function smartMatch(title = "") {
  const lower = title.toLowerCase();
  // duration
  let durationMin = null;
  const dm = lower.match(/(\d{1,3})\s*(?:min|mins|minutes|m\b)/);
  if (dm) durationMin = Number(dm[1]);
  const hm = lower.match(/(\d{1,2})\s*(?:hr|hrs|hour|hours|h\b)/);
  if (hm) durationMin = (durationMin || 0) + Number(hm[1]) * 60;

  // topic (longest name match wins)
  let topic = null;
  for (const t of TOPICS) {
    const nm = t.name.toLowerCase();
    if (nm.length >= 4 && lower.includes(nm)) {
      if (!topic || t.name.length > topic.name.length) topic = t;
    }
  }
  // common synonyms
  if (!topic) {
    const syn = { "error detection": "Error Detection", "percent": "Percentage", "si": "Simple Interest", "ci": "Compound Interest", "rc": "Reading Comprehension", "di": "Data Interpretation — Tables" };
    for (const [k, v] of Object.entries(syn)) if (lower.includes(k)) {
      const match = TOPICS.find((t) => t.name === v);
      if (match) { topic = match; break; }
    }
  }
  // task type
  let type = "learn";
  if (/\brevision\b|\brevise\b/.test(lower)) type = "revision";
  else if (/\bpyq|previous year/.test(lower)) type = "pyq";
  else if (/\bmock\b|test\b/.test(lower)) type = "mock";
  else if (/practice|solve|questions/.test(lower)) type = "practice";
  else if (/typing|wpm/.test(lower)) type = "typing";
  else if (/steno|shorthand|dictation/.test(lower)) type = "stenography";
  else if (/current affairs|gk|ca\b/.test(lower)) type = "current-affairs";
  else if (/running|push|physical/.test(lower)) type = "physical";

  return { durationMin, topic, type };

/* ============================ Planner ============================ */

  const month = mParam !== null && mParam !== "" ? Number(mParam) : now.getMonth();

            ${evs.length > 4 ? `<div class="faint small">+${evs.length - 4} more</div>` : ""}
          </div>`;
        }).join("")}
      </div>

};

const GROUP_ORDER = ["Overview", "Eligibility", "Study", "Practice", "Official", "Insights"];

/* ---------- routing ---------- */

function parseHash() {
  const raw = (location.hash || "#/dashboard").replace(/^#\/?/, "");
  const [pathPart, queryPart] = raw.split("?");
  const parts = pathPart.split("/").filter(Boolean);
  const params = new URLSearchParams(queryPart || "");
  return { parts, params };
}

function resolveRoute(parts) {
  const [first, second] = parts;
  if (!first) return { key: "dashboard", params: [] };
  if (first === "exams" && second) return { key: "examDetail", params: [second] };
  if (ROUTES[first]) return { key: first, params: parts.slice(1) };
  return { key: "dashboard", params: [] };
}

let currentRoute = "dashboard";

function navigate(hash) {
  const target = hash.startsWith("#") ? hash : `#/${hash}`;

}

  updateChrome();

  const { key, params } = resolveRoute(parts);
  currentRoute = key;

  const viewEl = document.getElementById("view");
  viewEl.scrollTop = 0;
  const ctx = { navigate, refresh, params, query, routeKey: key };

  // First-run redirect to onboarding
  if (!state.profile.onboardingComplete && key !== "profile") {
    location.hash = "#/profile";
    return;

  try {
    route.render(viewEl, ctx);
  } catch (err) {
    console.error("View render failed:", err);

      <p class="muted">${esc(err.message)}</p>
      <pre class="mono small">${esc(err.stack || "")}</pre></div>`;

}

  const side = document.getElementById("side-nav");
  const grouped = {};
  for (const [key, r] of Object.entries(ROUTES)) {
    if (r.group === "hidden") continue;
    (grouped[r.group] ||= []).push([key, r]);

  side.innerHTML = GROUP_ORDER.filter((g) => grouped[g]).map((g) => `
    <div class="nav-group-title">${esc(g)}</div>
    ${grouped[g].map(([key, r]) => `
      <a class="nav-item" data-nav="${key}" href="#/${key}">
        <span class="ni-ic">${r.icon}</span><span>${esc(r.title)}</span>
        <span class="ni-badge" data-badge="${key}" hidden></span>
      </a>`).join("")}`).join("");

  const bottom = document.getElementById("bottom-nav");
  const quick = [
    ["dashboard", "🏠", "Home"], ["planner", "🗓️", "Plan"], ["syllabus", "📚", "Syllabus"],

    <button class="bn-item" data-nav="${key}" data-route="#/${key}">
      <span class="bn-ic">${ic}</span><span>${esc(label)}</span>
    </button>`).join("") +
    `<button class="bn-item" data-action="toggle-sidebar"><span class="bn-ic">☰</span><span>More</span></button>`;

  const soonDeadlines = state.deadlines.filter((d) => !d.done && daysFromToday(d.date) !== null && daysFromToday(d.date) >= 0 && daysFromToday(d.date) <= 7).length;

/* ---------- theme ---------- */

function applyTheme() {

function toggleTheme() {

}

/* ---------- global actions ---------- */

function wireActions() {
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.dataset.action;

    if (action === "toggle-theme") return toggleTheme();

    if (action === "open-settings") return navigate("#/settings");

    document.getElementById("sidebar").classList.remove("open");
    if (!document.getElementById("modal-root").innerHTML) document.getElementById("overlay").hidden = true;
  });
}

/* ---------- global search ---------- */

function wireSearch() {
  const input = document.getElementById("global-search");
  const results = document.getElementById("search-results");
  let timer;

  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const q = input.value;
      if (q.trim().length < 2) { results.hidden = true; return; }
      const hits = searchAll(q);
      results.innerHTML = renderSearchResults(hits);
      results.hidden = false;
      results.querySelectorAll("[data-route]").forEach((b) => b.addEventListener("click", () => {
        navigate(b.dataset.route);
        results.hidden = true;
        input.value = "";

  });

  input.addEventListener("focus", () => { if (input.value.trim().length >= 2) results.hidden = false; });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrap")) results.hidden = true;
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { results.hidden = true; input.blur(); }
    if (e.key === "Enter") {
      const first = results.querySelector("[data-route]");
      if (first) { navigate(first.dataset.route); results.hidden = true; input.value = ""; }
    }
  });
}

/* ---------- boot ---------- */

function boot() {
  applyTheme();
